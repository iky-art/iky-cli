<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="@iky-art/iky adalah CLI serbaguna dengan 50 menu untuk teks, encoding, waktu, angka, warna, developer, dan file. Satu paket, satu terminal. Repo: iky-cli / cli-iky."
    />
    <meta name="theme-color" content="#e7ecf1" />
    <title>@iky-art/iky · 50 alat terminal dalam satu CLI</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/bricolage-grotesque-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/ibm-plex-sans-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      // Aktifkan Eruda console debugging: klik tombol Eruda di layar
      if (!window.eruda) {
        try { eruda.init(); } catch (_) {}
      }
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("iky-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (_) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Tampilkan error JavaScript langsung di halaman jika React gagal mount
      const root = document.getElementById("root");
      function showError(msg) {
        if (!root) return;
        root.innerHTML = `
          <div style="padding:24px; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#a12f2f; background:#efd0c4; border:1px solid #a12f2f; border-radius:10px; max-width:640px; margin:40px auto;">
            <h2 style="margin:0 0 12px; font-size:1.2rem;">Error memuat situs</h2>
            <pre style="margin:0; font-size:0.85rem; white-space:pre-wrap; word-break:break-all;">${String(msg).replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
            <p style="margin-top:12px; font-size:0.85rem; opacity:0.8;">Buka DevTools (F12) → Console untuk detail lebih lanjut.</p>
          </div>`;
      }
      window.onerror = function (msg, url, line, col, error) {
        showError(msg + (error ? "\n" + error.stack : ""));
        return false;
      };
      window.onunhandledrejection = function (event) {
        showError("Unhandled rejection: " + String(event.reason));
      };
    </script>
  </body>
</html>
